[package]
name = "tauri-kit-credentials"
version.workspace = true
description = "Secrets in the OS credential store, with test and development builds kept off the installed app's entries."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "keyring", "credentials", "secrets", "desktop"]
categories = ["authentication", "os"]

[dependencies]
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
