[package]
name = "tauri-kit-fs"
version.workspace = true
description = "Crash-safe file writes for desktop apps: write, sync, then rename into place."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "atomic", "fsync", "file", "desktop"]
categories = ["filesystem"]

[dependencies]
tempfile = "3"

[features]
# Observation points between the steps of a write, for tests of the app that uses this crate.
# Enable it from [dev-dependencies] only; see `Writer::observe_steps`.
test-hooks = []
