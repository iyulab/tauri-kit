[package]
name = "tauri-kit-sidecar"
version.workspace = true
description = "Run a bundled helper process for a desktop app: no console window, no orphans, and a readiness wait that notices a crash."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "sidecar", "process", "job-object", "desktop"]
categories = ["os"]

[features]
# A backend that serves HTTP on 127.0.0.1 with a bearer token: the token, the readiness line that
# announces the port, the discovery file a backend living on its own publishes, the endpoint, and
# the host side's failure answer. Off by default — it brings a JSON reader along.
loopback = ["dep:getrandom", "dep:serde", "dep:serde_json"]
# A blocking client for it, for an app with no HTTP client of its own.
loopback-client = ["loopback", "dep:ureq"]
# A web page's way to that backend through the app: the page asks in HTTP's shape (a custom URI scheme), the relay
# attaches the credential, passes only the routes the app lists, finds a restarted backend again, streams long answers
# and refuses with RFC 9457 problems. Frame-neutral: requests and responses are the `http` crate's.
relay = ["loopback-client", "dep:http"]
# A client of a supervisor's local pipe — a named pipe on Windows, a Unix socket elsewhere — speaking one
# JSON object per line: requests that carry an id, and events the supervisor pushes. For a shell whose
# backend is started and kept by another process.
pipe = ["dep:serde_json"]

[dependencies]
getrandom = { version = "0.4", optional = true }
ureq = { version = "3", default-features = false, optional = true }
http = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
# The pipe tests run a supervisor's named pipe in-process.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
