[package]
name = "tauri-kit-sidecar"
version.workspace = true
description = "Run a bundled helper process for a desktop app: no console window, no orphans, and a readiness wait that notices a crash."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "sidecar", "process", "job-object", "desktop"]
categories = ["os"]

[features]
# A sidecar that serves HTTP on 127.0.0.1 with a per-run token: the token, the readiness line that
# announces the port, a client, and the host side's failure answer. Off by default — it brings an
# HTTP client and a JSON reader along.
loopback = ["dep:getrandom", "dep:ureq", "dep:serde", "dep:serde_json"]

[dependencies]
getrandom = { version = "0.4", optional = true }
ureq = { version = "3", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
