[package]
name = "tauri-kit-dialog"
version.workspace = true
description = "One route for an app's open and save dialogs, which a test build can answer from a file the test writes — so end-to-end runs of the built app get past a native dialog without a person."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "dialog", "testing", "e2e", "desktop"]
categories = ["development-tools::testing", "gui"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tauri-kit-fs = { path = "../fs", version = "0.32.1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Answers dialogs from the file named by TAURI_KIT_DIALOG_ANSWERS. Enable it only in builds made for
# tests: without it the crate holds no such code, and every dialog is the app's own.
test-answers = ["dep:serde", "dep:serde_json", "dep:tauri-kit-fs"]
