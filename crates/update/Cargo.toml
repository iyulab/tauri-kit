[package]
name = "tauri-kit-update"
version.workspace = true
description = "Keep an installed desktop app up to date: look on a schedule that survives restarts, download in the background, install when the app closes or now, stop what must stop first — over any source of releases."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "update", "updater", "installer", "desktop"]
categories = ["os"]

[dependencies]
tauri-kit-fs = { path = "../fs", version = "0.30.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["win-system-proxy"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
] }

[features]
# `verify::authenticode`: check a downloaded installer's Authenticode signature against the expected
# signer (subject, issuer, thumbprint). Windows; elsewhere it refuses every file.
authenticode = ["dep:windows-sys"]
# `verify::developer_id`: check a downloaded macOS bundle's code signature — a notarized Developer ID
# signature of the expected team. macOS (the Security framework); elsewhere it refuses every bundle.
developer-id = []
# `github::Ureq`: the requests `github::Releases` makes, over ureq with the OS's TLS (SChannel on
# Windows, Security.framework on macOS; OpenSSL elsewhere) and the PC's proxy settings. Without it,
# `github::Releases` works over the app's own HTTP client (`github::Fetch`).
github = ["dep:ureq", "ureq/native-tls"]

[dev-dependencies]
tempfile = "3"
