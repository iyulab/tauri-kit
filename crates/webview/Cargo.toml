[package]
name = "tauri-kit-webview"
version.workspace = true
description = "The web view runtime under a desktop app's window: say in the person's language when WebView2 is missing, keep form entries out of the web view's profile, and keep a window that shows untrusted content on its own origins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "webview2", "autofill", "navigation", "desktop"]
categories = ["gui", "os"]

# The web view types an app holds come from the same `webview2-com` its Tauri version uses; the
# major version here follows Tauri's, so a controller the app passes in is the type expected here.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Already under webview2-com at this version; named here for the stream type a web resource response takes.
windows = { version = "0.62", features = ["Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The web view type an app holds on macOS comes from the same objc2 bindings its Tauri version uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSUserInterfaceItemIdentification", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView"] }

[dev-dependencies]
tempfile = "3"
