[package]
name = "tauri-kit-watch"
version.workspace = true
description = "Watch a folder for changes made by other programs: debounced, resolved to what is on disk, with the app's own writes left out."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tauri", "watch", "notify", "file", "desktop"]
categories = ["filesystem"]

[dependencies]
notify-debouncer-full = "0.7"
tauri-kit-fs = { path = "../fs", version = "0.9.0" }

[dev-dependencies]
tempfile = "3"
