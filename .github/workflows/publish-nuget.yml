name: Publish NuGet

# Packs the .NET host side (dotnet/) from the release tag this runs on; the organization's central publishing
# repository (iyulab/nuget-publish) pushes the packages to nuget.org. This workflow holds no NuGet credential.
# The crates are published with cargo; this keeps the package under the same version.
# Run by hand on a version tag: gh workflow run publish-nuget.yml --ref v<version>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse anything but a version tag
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "run this on a version tag, not $GITHUB_REF"; exit 1;; esac

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json

      - name: Check the tag names the package version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi

      - name: Test
        working-directory: dotnet
        run: dotnet test --solution TauriKit.Sidecar.slnx -c Release

      - name: Pack
        working-directory: dotnet
        run: dotnet pack TauriKit.Sidecar.slnx -c Release -o nupkg

      # Only package files: the central publisher refuses an artifact holding anything else.
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            dotnet/nupkg/*.nupkg
            dotnet/nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: pack
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit
