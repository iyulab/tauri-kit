name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # The toolchain is part of the key: target/ built by one compiler is dead weight to the next.
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-cargo-

      # A crate ships only what is in its own folder: each carries the license, kept word for word.
      - name: License in every crate
        if: runner.os == 'Linux'
        run: for f in crates/*/LICENSE; do cmp LICENSE "$f"; done; [ "$(ls crates/*/LICENSE | wc -l)" = "$(ls -d crates/*/ | wc -l)" ]

      - name: Format
        run: cargo fmt --all --check

      # Twice: optional features (test hooks) add code, and leaving them out must not leave any unused.
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  # The crates declare the oldest compiler they build with (`rust-version`). That promise is only
  # true while something builds with exactly that compiler, on every platform the crates target.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89

      - name: Check with the declared minimum
        run: cargo check --workspace --all-targets --all-features
