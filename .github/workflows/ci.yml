name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # The toolchain is part of the key: target/ built by one compiler is dead weight to the next.
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-cargo-

      # A crate ships only what is in its own folder: each carries the license, kept word for word.
      - name: License in every crate
        if: runner.os == 'Linux'
        run: for f in crates/*/LICENSE; do cmp LICENSE "$f"; done; [ "$(ls crates/*/LICENSE | wc -l)" = "$(ls -d crates/*/ | wc -l)" ]

      - name: Format
        run: cargo fmt --all --check

      # Twice: optional features (test hooks) add code, and leaving them out must not leave any unused.
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          # --all-features picks native TLS for the diagnostics sink; the rustls choice alone is its own build.
          cargo clippy -p tauri-kit-diagnostics --all-targets --no-default-features --features appinsights-rustls -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  # Public text: no local paths, private hosts or traces of a consumer's private workspace, in
  # tracked files and in commit messages (see CONTRIBUTING.md). The check comes from tauri-kit-dev,
  # pinned to a commit so a change there cannot turn this red unannounced.
  public-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads commit messages too.
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: iyulab/tauri-kit-dev
          ref: a71571ecd02e95022fd96469232e6fd0f2946753
          path: .tauri-kit-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check public text
        run: node .tauri-kit-dev/bin/tauri-kit-dev.js public-text --config scripts/public-text.config.js .

  # The crates declare the oldest compiler they build with (`rust-version`). That promise is only
  # true while something builds with exactly that compiler, on every platform the crates target.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89

      - name: Check with the declared minimum
        run: cargo check --workspace --all-targets --all-features

  # The .NET host side of the sidecar's loopback arrangement (dotnet/). Its tests also check that the
  # package carries the crates' version.
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json

      - name: Test
        working-directory: dotnet
        run: dotnet test --solution TauriKit.Sidecar.slnx
